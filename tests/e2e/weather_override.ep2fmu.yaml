schema_version: 1
model:
  name: ConfigOnlyWeatherOverride

inputs:
  - name: outdoorTemperature
    kind: actuator
    key: Environment
    component_type: Weather Data
    control_type: Outdoor Dry Bulb
    start: 20.0
    unit: degC

  - name: outdoorRelativeHumidity
    kind: actuator
    key: Environment
    component_type: Weather Data
    control_type: Outdoor Relative Humidity
    start: 50.0
    unit: percent

outputs:
  - name: indoorTemperature
    kind: variable
    key: ZONE ONE
    variable: Zone Mean Air Temperature
    unit: degC

  - name: indoorRelativeHumidity
    kind: variable
    key: ZONE ONE
    variable: Zone Air Relative Humidity
    unit: percent
